name: CI

on:
  push:
    branches:
      - main
      - 'feishu-*'
  pull_request:

jobs:
  check:
    name: Test, build, and verify package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
